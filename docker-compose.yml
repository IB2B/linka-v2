services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-linka}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Elestio's reverse proxy forwards the public domain to host :3000,
      # while the app listens on :4000 inside the container.
      - "3000:4000"
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-linka}
    env_file:
      - .env
    volumes:
      # User-generated files (AI images, avatars, post/inbox/support uploads)
      # are written to /app/uploads. Without this volume they live on the
      # container's ephemeral layer and are wiped on every redeploy — which
      # left every stored image 404ing in production.
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
